<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML5 API Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    section {
      margin-bottom: 40px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    #dragBox {
      width: 100px;
      height: 100px;
      background: steelblue;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
    }
    #dropZone {
      width: 200px;
      height: 200px;
      border: 2px dashed #666;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
    }
    input, button {
      margin-top: 10px;
      padding: 5px;
    }
  </style>
</head>
<body>

  <h1>HTML5 APIs Demo</h1>

  <!-- Drag & Drop -->
  <section>
    <h2>Drag & Drop API</h2>
    <div id="dragBox" draggable="true">Drag me</div>
    <div id="dropZone">Drop here</div>
  </section>

  <!-- Geolocation -->
  <section>
    <h2>Geolocation API</h2>
    <button onclick="getLocation()">Get My Location</button>
    <p id="locationOutput">Location will appear here.</p>
  </section>

  <!-- Web Storage -->
  <section>
    <h2>Web Storage API (localStorage)</h2>
    <input type="text" id="storageInput" placeholder="Enter something">
    <button onclick="saveData()">Save</button>
    <button onclick="loadData()">Load</button>
    <p id="storageOutput"></p>
  </section>

  <script>
    // Drag & Drop
    const dragBox = document.getElementById("dragBox");
    const dropZone = document.getElementById("dropZone");

    dragBox.addEventListener("dragstart", function(event) {
      event.dataTransfer.setData("text", "Dragged!");
    });

    dropZone.addEventListener("dragover", function(event) {
      event.preventDefault(); // Allow drop
    });

    dropZone.addEventListener("drop", function(event) {
      event.preventDefault();
      dropZone.textContent = "Dropped!";
    });

    // Geolocation
    function getLocation() {
      const output = document.getElementById("locationOutput");

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          position => {
            output.textContent = 
              `Latitude: ${position.coords.latitude}, Longitude: ${position.coords.longitude}`;
          },
          error => {
            output.textContent = "Error getting location.";
          }
        );
      } else {
        output.textContent = "Geolocation not supported.";
      }
    }

    // Web Storage
    function saveData() {
      const value = document.getElementById("storageInput").value;
      localStorage.setItem("myData", value);
      alert("Data saved!");
    }

    function loadData() {
      const data = localStorage.getItem("myData");
      document.getElementById("storageOutput").textContent =
        data ? `Stored Value: ${data}` : "No data found.";
    }
  </script>

</body>
</html>
